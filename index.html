    <!-- Structured data (schema.org) so search engines can show this as a
         car rental business — hours, phone, area served — not just a page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRental",
        "name": "Quantum Car Hire",
        "description": "Self-drive car rentals, airport transfers and island tours in Mahé, Seychelles.",
        "url": "https://www.quantumcarhire.com/",
        "logo": "https://www.quantumcarhire.com/apple-touch-icon.png",
        "image": "https://www.quantumcarhire.com/og-image.jpg",
        "telephone": "+248-2600-010",
        "email": "info@quantumcarhire.com",
        "priceRange": "SCR 550+",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Perseverance",
          "addressLocality": "Mahé",
          "addressCountry": "SC"
        },
        "areaServed": {
          "@type": "Place",
          "name": "Mahé, Seychelles"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        },
        "sameAs": ["https://facebook.com/quantumcarhire"]
      }
    </script>
